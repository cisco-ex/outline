name: on push

on: push

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: login
        uses: redhat-actions/podman-login@v2
        with:
          registry: artifactory.devhub-cloud.cisco.com
          username: rudder.gen
          password: ${{ secrets.devhub }}
      - name: login
        uses: redhat-actions/podman-login@v2
        with:
          registry: ghcr.io/cisco-ex
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          tags: |
            type=raw,value={{ date 'YYYYMMDDHHmmss' }},prefix=${{ github.ref_name }}-
            type=sha
            type=ref,event=branch
      - name: build container image
        id: build
        uses: redhat-actions/buildah-build@v3
        with:
          containerfiles: ./Containerfile
          image: outline
          tags: ${{ steps.meta.outputs.tags }}
          extra-args: |
            --annotation com.cisco.devices.rudder.branch=${{ github.ref_name }}
            --annotation com.cisco.devices.rudder.env=prod
          oci: true
      - name: push
        uses: redhat-actions/push-to-registry@v3
        with:
          registry: ghcr.io/cisco-ex
          image: ${{ steps.build.outputs.image }}
          tags: ${{ steps.build.outputs.tags }}
